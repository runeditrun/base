name: Verify

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      tier:
        type: string
        default: push
      timeout:
        type: number
        default: 12

permissions:
  contents: read

concurrency:
  group: seed-verify-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      skip: ${{ steps.duplicate.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check reusable workflow permissions
        run: node scripts/verify-ci.mjs --check-workflows
      - name: Reuse successful branch verification on main
        id: duplicate
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-ci.mjs --main-skip
      - id: plan
        env:
          TIER: ${{ inputs.tier || 'push' }}
        run: echo "matrix=$(node scripts/verify-ci.mjs --matrix "$TIER")" >> "$GITHUB_OUTPUT"

  shards:
    needs: plan
    if: ${{ needs.plan.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout || 12 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      PLAYWRIGHT_SKIP_BROWSER_GC: '1'
      # Keep browser downloads independent of HOME and sudo's apt ownership.
      PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - name: Check edition source lock freshness
        if: ${{ hashFiles('edition.json', 'sources.lock.json') != '' }}
        run: node scripts/edition-authoring/cli.mjs check
      - run: npm install --global pnpm@10.12.4
      - name: Prepare runner-owned browser and apt caches
        if: matrix.browser
        run: |
          set -euo pipefail
          id
          printf 'Runner HOME=%s\n' "$HOME"
          if [ -e "$HOME/.cache" ]; then
            stat -c 'Home cache: %n uid=%u gid=%g mode=%a' "$HOME/.cache"
          else
            printf 'Home cache: absent\n'
          fi
          mkdir -p "$PLAYWRIGHT_BROWSERS_PATH" "$RUNNER_TEMP/rer-apt/archives"
      # Save completed packages; apt keeps partial downloads private to _apt.
      - name: Cache frozen dependencies and Chromium
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~/.local/share/pnpm/store
            ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
            ${{ runner.temp }}/rer-apt/archives/*.deb
          # Old snapshots contain absolute HOME paths; do not restore them here.
          key: seed-ubuntu24-temp-${{ runner.arch }}-browser-${{ matrix.browser }}-${{ hashFiles('pnpm-lock.yaml', 'package.json') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm run deps
      - name: Install Chromium and system libraries
        if: matrix.browser
        run: |
          set -euo pipefail
          stat -c 'Before apt: %n uid=%u gid=%g mode=%a' "$PLAYWRIGHT_BROWSERS_PATH" "$RUNNER_TEMP/rer-apt/archives"
          sudo env "PATH=$PATH" "APT_ARCHIVES=$RUNNER_TEMP/rer-apt/archives" python3 scripts/install-chromium-deps.py
          stat -c 'After apt: %n uid=%u gid=%g mode=%a' "$PLAYWRIGHT_BROWSERS_PATH" "$RUNNER_TEMP/rer-apt/archives"
          pnpm exec playwright install chromium
      - name: Reserve disk for native runtime journeys
        if: matrix.browser
        run: |
          free_kib() { df -Pk "$GITHUB_WORKSPACE" | awk 'END { print $4 }'; }
          for unused_tools in /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL; do
            if [ "$(free_kib)" -ge "$((20 * 1024 * 1024))" ]; then break; fi
            sudo rm -rf -- "$unused_tools"
          done
      - name: Run this shard
        env:
          SHARD: ${{ matrix.name }}
        run: node scripts/verify-ci.mjs "$SHARD"

  verify:
    needs: [plan, shards]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require every shard
        env:
          PLAN: ${{ needs.plan.result }}
          SHARDS: ${{ needs.shards.result }}
          SKIP: ${{ needs.plan.outputs.skip }}
        run: |
          test "$PLAN" = success && {
            test "$SHARDS" = success || { test "$SKIP" = true && test "$SHARDS" = skipped; }
          }
