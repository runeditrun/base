# Adoption note: add it only when the seed's demo is adopted (DEMO.md "Hosting the demo")
name: Run demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: run-demo
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.RUN_DEMO_DEPLOY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: run-demo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - run: corepack enable && pnpm install --frozen-lockfile
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      # Wrangler builds the container image with the runner's Docker and pushes it to the account.
      - run: pnpm exec rer deploy --demo
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      - name: Public readback
        run: |
          domain=demo.$(node -p "require('./deploy-demo.json').domain")
          for i in $(seq 1 60); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' "https://$domain/")" = 200 ] && break
            sleep 10
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' "https://$domain/")" = 200
          ! curl -s -D - -o /dev/null "https://$domain/" | grep -qi '^set-cookie:'
