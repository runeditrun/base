name: Verify

on:
  pull_request:
  push:
    branches: [main]
    tags: ['**']
  schedule:
    - cron: '17 14 * * *'
  workflow_dispatch:
    inputs:
      clean_bootstrap:
        description: Run without restoring dependency, browser or apt caches
        type: boolean
        default: false
      journeys:
        description: Include slow installer and README journeys
        type: boolean
        default: false

permissions:
  contents: read

env:
  CI_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

# Keep each main run; a green push of the same SHA to a branch or tag can satisfy it.
# A distinct run key also avoids GitHub replacing a pending main run.
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  plan:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.stages.outputs.matrix }}
      skip: ${{ steps.duplicate.outputs.skip }}
      qualify-browser: ${{ steps.browser.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.20.0'
      - name: Reuse successful branch verification on main
        id: duplicate
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node export/verify-ci.mjs --main-skip
      - name: Select browser setup qualification when its implementation changes
        id: browser
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=false
          if [ "$EVENT_NAME" = pull_request ]; then
            if git diff --name-only "$BASE_SHA" HEAD -- scripts/agent-bootstrap.sh scripts/ci/browser-probe.mjs scripts/ci/browser-qualification.mjs | read -r _; then changed=true; fi
          fi
          printf 'changed=%s\n' "$changed" >> "$GITHUB_OUTPUT"
      - id: stages
        name: Assign every full-verify stage exactly once
        env:
          CI_INCLUDE_JOURNEYS: ${{ github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/') || inputs.journeys }}
        run: |
          matrix=$(node scripts/ci/verify.mjs --matrix)
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  companion-macos:
    needs: plan
    if: ${{ needs.plan.outputs.skip != 'true' }}
    name: Verify (companion macOS)
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.20.0'
      # These flows exercise Seatbelt itself: provider reads/writes and retained
      # checkout Git filters must stay inside the real macOS boundary.
      - name: Run all four companion tests inside the supported OS boundary
        run: node --test --test-concurrency=1 cli/companion.test.mjs

  build-reference:
    name: Build reference once
    needs: plan
    if: ${{ needs.plan.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.20.0'
      - name: Install pinned package manager
        run: npm install --global pnpm@10.12.4 --no-audit --no-fund
      - name: Cache build dependencies
        if: ${{ !inputs.clean_bootstrap }}
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ~/.local/share/pnpm/store
          key: base-build-ubuntu24-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install frozen build dependencies
        run: pnpm --config.only-built-dependencies=esbuild --config.only-built-dependencies=workerd install --frozen-lockfile
      - name: Build and qualify credential-free reference output
        run: node scripts/ci/reference-build.mjs "$RUNNER_TEMP/reference-build"
      - name: Share reviewed output with this run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reference-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reference-build
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  browser-qualification:
    name: Browser setup (${{ matrix.seed }}, ${{ matrix.strategy }})
    needs: plan
    if: ${{ needs.plan.outputs.qualify-browser == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        seed: [pegboard, nook]
        strategy: [baseline, candidate]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.20.0'
      - name: Install pinned package manager
        run: npm install --global pnpm@10.12.4 --no-audit --no-fund
      - name: Measure actual pinned snapshot browser setup cold and warm
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/browser-qualification.mjs "${{ matrix.seed }}" "${{ matrix.strategy }}"
      - name: Retain browser setup context and timings
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-setup-${{ matrix.seed }}-${{ matrix.strategy }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/browser-qualification-${{ matrix.seed }}-${{ matrix.strategy }}.json
          if-no-files-found: error

  verify:
    name: Verify (Linux ${{ matrix.group }})
    needs: [plan, build-reference]
    if: ${{ needs.plan.outputs.skip != 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      # Docker's official ubuntu:24.04, mirrored by mirror-ubuntu-image.yml to GHCR: hosted runners pull it with GITHUB_TOKEN, free of the anonymous Docker Hub and ECR Public limits that failed jobs before they started.
      image: ghcr.io/runeditrun/ubuntu:24.04@sha256:534baea6a22c03a63003dbc8dbe78fe34bc0d7e595d9a9dc9834884ff530eb55
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --init
      volumes:
        - /usr/local/lib/android:/runner-preinstalled/android
    timeout-minutes: ${{ matrix.group == 'journeys' && 60 || 25 }}
    env:
      TZ: UTC
      RER_VERIFY_WORKERS: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Require an init process to reap cancelled command descendants
        run: |
          set -euo pipefail
          # The Actions container entrypoint is `tail -f /dev/null`. Without
          # `options: --init` it is PID 1, so orphaned zombies are never reaped and
          # the strict process-cleanup tests fail with an unrelated-looking message.
          pid1_comm=$(cat /proc/1/comm)
          if [ "$pid1_comm" = tail ]; then
            printf 'Container PID 1 is %s, not an init process; keep container options: --init so cancelled child processes are reaped.\n' "$pid1_comm" >&2
            exit 1
          fi
      - name: Reclaim unused hosted Android tools for native consumer verification
        if: ${{ matrix.native }}
        run: |
          set -euo pipefail
          df -Pk "$GITHUB_WORKSPACE"
          # Retain the mount, runner runtimes, caches and images. Check before
          # each individual deletion and stop as soon as 20 GiB is available.
          while IFS= read -r -d '' entry; do
            available_kib=$(df --output=avail -k "$GITHUB_WORKSPACE" | tail -n 1)
            if (( available_kib >= 20 * 1024 * 1024 )); then break; fi
            du -sk -- "$entry"
            rm -rf -- "$entry"
          done < <(find /runner-preinstalled/android -mindepth 1 -maxdepth 1 -print0)
          df -Pk "$GITHUB_WORKSPACE"
      - name: Install checkout prerequisites
        run: |
          # Attempt 1 uses the runner's Azure mirror, which avoids the public
          # archive's runner-dependent ~80 kB/s transfers. A fresh runner can
          # have a dead Azure package path (index fetches work, package GETs
          # hang), so retrying the same host does not help: attempts 2 and 3
          # use other mirrors serving the same Ubuntu-signed archive. Keep this
          # list in step with apt_fallback_mirrors in scripts/agent-bootstrap.sh.
          mirrors=(http://azure.archive.ubuntu.com/ubuntu http://mirrors.edge.kernel.org/ubuntu http://us-east-1.ec2.archive.ubuntu.com/ubuntu)
          # Checkout cannot source a repository helper or restore an Actions
          # cache yet. Retain apt archives/partials locally across fresh attempts.
          mkdir -p /var/tmp/rer-checkout-apt/archives
          export APT_CONFIG=/var/tmp/rer-checkout-apt/apt.conf
          cat > "$APT_CONFIG" <<'APT'
          Dir::Cache::archives "/var/tmp/rer-checkout-apt/archives";
          APT::Keep-Downloaded-Packages "true";
          APT::Update::Error-Mode "any";
          Acquire::Retries "2";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          APT
          started=$SECONDS
          for attempt in 1 2 3; do
            mirror=${mirrors[attempt - 1]}
            sed -i -E "s@^(URIs:[[:space:]]*)https?://(([a-z0-9.-]+\.)?archive\.ubuntu\.com|security\.ubuntu\.com|mirrors\.edge\.kernel\.org)/ubuntu/?@\1${mirror}/@" /etc/apt/sources.list.d/ubuntu.sources
            printf 'Checkout apt: prerequisites attempt %s/3 (90s deadline; mirror %s)\n' "$attempt" "$mirror"
            if timeout --kill-after=5s 90s bash -ec '
              dpkg --configure -a
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates git
            '; then
              printf 'Checkout apt: prerequisites complete (attempts=%s mirror=%s seconds=%s)\n' "$attempt" "$mirror" "$((SECONDS - started))"
              exit 0
            else
              status=$?
              printf 'Checkout apt: prerequisites attempt %s/3 failed (mirror %s, exit %s, seconds=%s)\n' "$attempt" "$mirror" "$status" "$((SECONDS - started))" >&2
            fi
            if (( attempt < 3 )); then sleep "$((attempt * 2))"; fi
          done
          printf 'Checkout apt: prerequisites failed after 3 attempts (exit %s; 90s per attempt; seconds=%s). Inspect the apt download log.\n' "$status" "$((SECONDS - started))" >&2
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record clean Linux preconditions before cache restore
        run: |
          test "$(uname -s)" = Linux
          if command -v node || command -v pnpm; then
            printf 'Expected a container without Node or pnpm\n' >&2
            exit 1
          fi
          test ! -d node_modules
          test ! -d default-seed/node_modules
          test ! -d "$HOME/.cache/ms-playwright"
          printf 'Clean Linux: no Node, pnpm, dependencies or browser cache before restore\n'
      - name: Read the pinned Playwright version for the apt cache
        id: apt-cache-inputs
        run: |
          version=$(sed -n 's/^readonly PLAYWRIGHT_VERSION=//p' scripts/agent-bootstrap.sh)
          test -n "$version"
          printf 'playwright=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Cache apt package archives
        id: apt-cache
        if: ${{ !inputs.clean_bootstrap }}
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ~/.cache/rer-apt/archives
          key: base-apt-ubuntu24-${{ runner.arch }}-playwright-${{ steps.apt-cache-inputs.outputs.playwright }}-${{ hashFiles('scripts/agent-bootstrap.sh') }}
      - name: Cache shared pnpm store
        if: ${{ !inputs.clean_bootstrap }}
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ~/.local/share/pnpm/store
          key: base-ubuntu24-${{ runner.arch }}-${{ hashFiles('scripts/agent-bootstrap.sh', 'scripts/install-gitleaks.sh', 'pnpm-lock.yaml', 'modules/mail/pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', 'default-seed/package.json', 'foundation/template/package.json', 'foundation/template/pnpm-lock.yaml') }}
      - name: Cache Chromium only for browser jobs
        if: ${{ matrix.browser && !inputs.clean_bootstrap }}
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ~/.cache/ms-playwright
          key: base-browser-ubuntu24-${{ runner.arch }}-${{ steps.apt-cache-inputs.outputs.playwright }}
      - name: Bootstrap pinned Linux toolchain
        env:
          APT_CACHE_HIT: ${{ steps.apt-cache.outputs.cache-hit || 'false' }}
          BROWSER_NEEDED: ${{ matrix.browser }}
          NATIVE_CONSUMER: ${{ matrix.native }}
        run: |
          printf 'Apt archive cache hit: %s\n' "$APT_CACHE_HIT"
          # Checkout configures a temporary HOME; the root container's test
          # shell needs this exact reviewed workspace trusted in its own HOME.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse HEAD
          browser_args=()
          if [ "$BROWSER_NEEDED" = true ]; then browser_args+=(--browser); fi
          bash scripts/agent-bootstrap.sh "${browser_args[@]}"
          # Measure the actual consumer filesystem after dependency/browser
          # installation. The editor's own 15 GiB guard remains authoritative.
          df -Pk "$GITHUB_WORKSPACE"
          available_kib=$(df --output=avail -k "$GITHUB_WORKSPACE" | tail -n 1)
          if [ "$NATIVE_CONSUMER" = true ] && (( available_kib < 15 * 1024 * 1024 )); then
            printf 'Verification requires at least 15 GiB free after bootstrap; available: %s KiB\n' "$available_kib" >&2
            exit 1
          fi
      - name: Download this run's reference build
        if: ${{ matrix.group == '5' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: reference-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reference-build
      - name: Run full-verify stages assigned to this job
        env:
          VERIFY_GROUP: ${{ matrix.group }}
          BASE_VERIFY_BUILD_ARTIFACT: ${{ matrix.group == '5' && format('{0}/reference-build', runner.temp) || '' }}
          RER_TEST_EVIDENCE_DIRECTORY: ${{ runner.temp }}/rer-test-evidence
        run: |
          mkdir -p "$RER_TEST_EVIDENCE_DIRECTORY"
          node scripts/ci/verify.mjs "$VERIFY_GROUP"
      - name: Retain command diagnostics when verification fails
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verify-evidence-${{ matrix.group }}
          path: ${{ runner.temp }}/rer-test-evidence
          if-no-files-found: ignore
      - name: Fetch pinned active HappyToHelp source without credentials
        if: ${{ !cancelled() && matrix.group == '8' }}
        env:
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_TERMINAL_PROMPT: '0'
          GIT_ASKPASS: /bin/false
        run: |
          git -c credential.helper= init "$RUNNER_TEMP/public-happytohelp"
          git -c credential.helper= -C "$RUNNER_TEMP/public-happytohelp" fetch --depth=1 https://github.com/just-every/happytohelp.git 60e9a84688ea41575d56a8f692bbb8173366c7c5
          git -c credential.helper= -C "$RUNNER_TEMP/public-happytohelp" checkout --detach FETCH_HEAD
      - name: Select the active edition's pinned runtime after Base stages finish
        if: ${{ !cancelled() && matrix.group == '8' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26.8.1'
      - name: Packed launcher acquisition, browser onboarding and offline resume for active HappyToHelp
        if: ${{ !cancelled() && matrix.group == '8' }}
        run: node scripts/ci/launcher-acceptance.mjs
      - name: Remove active-edition acceptance checkouts
        if: ${{ always() && matrix.group == '8' }}
        run: |
          rm -rf -- "$RUNNER_TEMP/public-happytohelp" "$RUNNER_TEMP/base-launcher-evidence"
          rm -f -- "$RUNNER_TEMP/launcher-release-manifest.json"
