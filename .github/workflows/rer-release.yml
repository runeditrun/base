name: Release rer

# Publishes @runeditrun/rer from a rer-v<version> tag that equals the version
# source (global/package.json) and points at a main commit whose Verify run is
# green. Every other trigger is a dry run: every step except npm publish and
# the release record. One build; the scan, the smoke test and npm publish all
# use that exact tarball (the publish job takes the build job's artifact and
# checks its sha256). No Worker, R2 or website deploy is involved.
on:
  push:
    tags: ['rer-v*']
    branches: ['**']
    paths:
      - global/**
      - scripts/rer-package.mjs
      - scripts/rer-package/**
      - .github/workflows/rer-release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rer-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read # the tagged commit's Verify result
    outputs:
      publish: ${{ steps.mode.outputs.publish }}
      version: ${{ steps.build.outputs.version }}
      integrity: ${{ steps.build.outputs.integrity }}
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.20.0'

      - name: Release or dry run
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "DIST=$RUNNER_TEMP/rer-dist" >> "$GITHUB_ENV"
          version=$(node -p "require('./global/package.json').version")
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ "$GITHUB_REF_NAME" != "rer-v$version" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not equal the version source: global/package.json names $version (tag rer-v$version)."
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main."
              exit 1
            fi
            green=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/verify.yml/runs?head_sha=$GITHUB_SHA&status=success&per_page=1" --jq '.total_count')
            if [[ "$green" == 0 ]]; then
              echo "::error::$GITHUB_SHA has no green Verify run; release only a commit whose CI passed."
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Release: $GITHUB_REF_NAME at $GITHUB_SHA (on main, Verify green)."
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Dry run ($GITHUB_EVENT_NAME on $GITHUB_REF): every step except npm publish and the release record."
          fi

      - name: Build the tarball once
        id: build
        run: |
          set -euo pipefail
          tarball=$(node scripts/rer-package.mjs --out "$DIST" | tail -n 1)
          version=$(tar -xOzf "$tarball" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          tar -xOzf "$tarball" package/install.sh > "$DIST/install.sh"
          (cd "$DIST" && sha256sum "$(basename "$tarball")" install.sh > SHA256SUMS)
          integrity="sha512-$(openssl dgst -sha512 -binary "$tarball" | base64 -w0)"
          {
            echo "tarball=$tarball"
            echo "version=$version"
            echo "integrity=$integrity"
          } >> "$GITHUB_OUTPUT"
          cat "$DIST/SHA256SUMS"
          echo "version $version, integrity $integrity"
          echo "uncompressed tar sha256: $(gzip -dc "$tarball" | sha256sum | cut -d' ' -f1)"

      - name: Same bytes from a second clone at another path
        env:
          TARBALL: ${{ steps.build.outputs.tarball }}
        run: |
          set -euo pipefail
          second="$RUNNER_TEMP/second clone/base"
          git clone --quiet --no-local "$GITHUB_WORKSPACE" "$second"
          git -C "$second" checkout --quiet --detach "$GITHUB_SHA"
          rebuilt=$(cd "$second" && node scripts/rer-package.mjs --out "$RUNNER_TEMP/second-dist" | tail -n 1)
          sha256sum "$TARBALL" "$rebuilt"
          cmp "$TARBALL" "$rebuilt"
          rm -rf -- "$RUNNER_TEMP/second clone" "$RUNNER_TEMP/second-dist"

      - name: The version carries no development stamp
        env:
          VERSION: ${{ steps.build.outputs.version }}
          PUBLISH: ${{ steps.mode.outputs.publish }}
        run: |
          if [[ "$VERSION" == *-* ]]; then
            if [[ "$PUBLISH" == true ]]; then echo "::error::$VERSION carries a development stamp; a release tag build must not."; exit 1; fi
            echo "Dry run: $VERSION carries the development stamp an untagged commit gets; a release tag build would refuse it."
          else
            echo "$VERSION carries no development stamp."
          fi

      - name: Publication and secret scan of the unpacked tarball
        env:
          TARBALL: ${{ steps.build.outputs.tarball }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          GITLEAKS_INSTALL_DIR="$RUNNER_TEMP/bin" bash scripts/install-gitleaks.sh
          export PATH="$RUNNER_TEMP/bin:$PATH"
          scan="$RUNNER_TEMP/scan"
          mkdir -p "$scan"
          tar -xzf "$TARBALL" -C "$scan"
          git -C "$scan/package" init --quiet
          git -C "$scan/package" add --all
          git -C "$scan/package" -c user.name='rer release' -c user.email='release@runeditrun.invalid' commit --quiet -m 'The exact @runeditrun/rer tarball'
          status=0
          node scripts/publish-check.mjs --repo "$scan/package" --ref HEAD > "$DIST/scan.json" || status=$?
          node -e '
            const report = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            console.log(`scan ${report.status}: ${report.findings.length} findings, ${report.warnings.length} warnings`);
            for (const finding of report.findings) console.log(`  ${finding.rule} ${finding.path}`);
            process.exitCode = report.status === "PASS" && report.findings.length === 0 ? 0 : 1;
          ' "$DIST/scan.json"
          [[ "$status" == 0 ]]
          rm -rf -- "$scan"

      - name: Smoke-test the tarball in a clean HOME
        env:
          TARBALL: ${{ steps.build.outputs.tarball }}
        run: |
          set -euo pipefail
          # rer dev's disk guard wants 15 GiB free; the hosted image's Android
          # SDK is the one large thing this job never uses.
          sudo rm -rf /usr/local/lib/android
          df -h "$RUNNER_TEMP" /tmp
          # The seed's own package manager, as a person installs it.
          npm install --global --no-audit --no-fund pnpm@10.34.7
          node scripts/rer-package/smoke.mjs "$TARBALL"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rer-${{ steps.build.outputs.version }}
          path: |
            ${{ env.DIST }}/*.tgz
            ${{ env.DIST }}/install.sh
            ${{ env.DIST }}/SHA256SUMS
            ${{ env.DIST }}/scan.json

      - name: Summary
        if: always()
        env:
          VERSION: ${{ steps.build.outputs.version }}
          INTEGRITY: ${{ steps.build.outputs.integrity }}
          PUBLISH: ${{ steps.mode.outputs.publish }}
        run: |
          {
            echo "### @runeditrun/rer ${VERSION:-(not built)}"
            echo
            if [[ "$PUBLISH" == true ]]; then echo "Release build from $GITHUB_REF_NAME; the publish job publishes it."; else echo "Dry run: nothing published, no release recorded."; fi
            echo
            echo "Integrity: \`${INTEGRITY:-}\`"
            if [[ -f "$DIST/SHA256SUMS" ]]; then echo; echo '```'; cat "$DIST/SHA256SUMS"; echo '```'; fi
            if [[ -f "$DIST/scan.json" ]]; then node -p "const r = require(process.argv[1]); 'Scan: ' + r.status + ', ' + r.findings.length + ' findings'" "$DIST/scan.json"; fi
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The environment's deployment rule admits rer-v* tags only; it holds the
    # NPM_TOKEN environment secret (never a repository secret) and is named in the
    # npm trusted publisher, so only a release tag run can publish.
    environment: npm
    permissions:
      contents: write # the release record
      id-token: write # npm trusted publishing, when configured
    env:
      VERSION: ${{ needs.build.outputs.version }}
      INTEGRITY: ${{ needs.build.outputs.integrity }}
    steps:
      - run: echo "DIST=$RUNNER_TEMP/rer-dist" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.20.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rer-${{ needs.build.outputs.version }}
          path: ${{ env.DIST }}

      - name: The exact tarball the build scanned and smoke-tested
        id: tarball
        run: |
          set -euo pipefail
          cd "$DIST"
          sha256sum --check --strict SHA256SUMS
          tarball="$DIST/runeditrun-rer-$VERSION.tgz"
          [[ "sha512-$(openssl dgst -sha512 -binary "$tarball" | base64 -w0)" == "$INTEGRITY" ]]
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        env:
          TARBALL: ${{ steps.tarball.outputs.tarball }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if npm view "@runeditrun/rer@$VERSION" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "@runeditrun/rer@$VERSION is already published; nothing to publish and nothing rebuilt."
            exit 0
          fi
          # Trusted publishing (OIDC) needs npm 11.5.1 or later; npm uses it when
          # the package trusts this workflow, else the NPM_TOKEN secret below.
          npm install --global --no-audit --no-fund npm@11.6.2
          npmrc="$RUNNER_TEMP/publish.npmrc"
          if [[ -n "$NODE_AUTH_TOKEN" ]]; then
            printf '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}\n' > "$npmrc"
          else
            : > "$npmrc"
          fi
          # Provenance remains disabled until the release attestation flow is qualified.
          NPM_CONFIG_USERCONFIG="$npmrc" npm publish "$TARBALL" --access public --provenance=false --registry=https://registry.npmjs.org
          rm -f -- "$npmrc"

      - name: Record the release
        env:
          GH_TOKEN: ${{ github.token }}
          TARBALL: ${{ steps.tarball.outputs.tarball }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "The release $GITHUB_REF_NAME is already recorded."
            exit 0
          fi
          scan=$(node -p "const r = require(process.argv[1]); r.status + ', ' + r.findings.length + ' findings'" "$DIST/scan.json")
          {
            echo "@runeditrun/rer $VERSION from $GITHUB_SHA."
            echo
            echo "npm integrity: \`$INTEGRITY\`"
            echo
            echo "Publication and secret scan of the exact tarball: $scan."
            echo
            echo '```'
            cat "$DIST/SHA256SUMS"
            echo '```'
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "rer $VERSION" --notes-file "$RUNNER_TEMP/notes.md" \
            "$TARBALL" "$DIST/install.sh" "$DIST/SHA256SUMS" "$DIST/scan.json"
